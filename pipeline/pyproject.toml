[project]
name = "chunking-lab"
version = "0.1.0"
description = "Ingestion, canonicalisation, chunking and benchmarking for SEC 10-K filings"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "lxml>=5.2",
  "numpy>=1.26",
  "psycopg[binary]>=3.2",
  "tokenizers>=0.20",
  "onnxruntime>=1.19",
  "psutil>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "ruff>=0.6",
]

[project.scripts]
chunking-lab = "chunking_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chunking_lab"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
